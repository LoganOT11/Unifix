[pytest]
# Pin the rootdir to the vendored engine source root so pytest imports the
# tests as top-level modules (e.g. `tests.test_fuzzy_resolver`) rather than
# resolving them under the `unifix_odoo` Odoo package — which would pull in
# `from odoo import ...` and fail outside an Odoo runtime.
testpaths = tests
consider_namespace_packages = false
